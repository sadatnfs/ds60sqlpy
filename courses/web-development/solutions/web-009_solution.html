<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form constraints, errors and helpful recovery</title>
    <style>
          :root { color-scheme: light; font-family: system-ui, sans-serif; line-height: 1.6; }
          body { margin: 0; padding: 1.5rem; color: #172033; background: #f8fafc; }
          main { max-width: 65rem; margin-inline: auto; }
          a { color: #0753a4; }
          button, input, select, textarea { font: inherit; }
          button { cursor: pointer; }
          :focus-visible { outline: 3px solid #a34000; outline-offset: 3px; }
          #reference-status { display: block; margin-block-start: 2rem; border-block-start: 1px solid #64748b; padding-block-start: 1rem; }
      input:invalid { border: 2px solid #9c2300; }
    </style>
  </head>
  <body>
    <main
      ><h1>Study time</h1
      ><form
        ><label for="minutes">Minutes, 5 to 120</label
        ><input
          id="minutes"
          name="minutes"
          type="number"
          min="5"
          max="120"
          required
          aria-describedby="time-help"
          value="30"
        /><p id="time-help">Choose a realistic duration. This form is an offline preview.</p
        ><button type="button">Keep practicing locally</button></form
      ></main
    >
    <output id="reference-status" aria-live="polite">Reference checks pending.</output>
    <script>
      "use strict";
      function check(condition, message) {
        if (!condition) throw new Error(message);
      }

      check(document.querySelector('#minutes').checkValidity(), 'Initial valid number expected');
      document.querySelector("#reference-status").textContent = "web-009 reference checks passed. Complete the manual observations in the guide.";
      console.log("web-009 reference checks passed");
    </script>
  </body>
</html>
