name: Course validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  core:
    name: Core checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Verify locked dependencies
        run: uv lock --check
      - name: Install the locked core environment
        run: >-
          uv sync --frozen --extra notebooks --extra data --extra bridge
          --extra quality --extra professional --extra sql-notebooks
      - name: Regenerate catalog
        run: uv run --no-sync python scripts/build_catalog.py
      - name: Check catalog drift
        run: git diff --exit-code -- curriculum/catalog.json
      - name: Lint
        run: uv run --no-sync ruff check src scripts tests bridge python/professional
      - name: Check formatting
        run: >-
          uv run --no-sync ruff format --check
          src scripts tests bridge python/professional
      - name: Scan repository for common credential material
        run: uv run --no-sync python scripts/scan_secrets.py
      - name: Type check
        run: uv run --no-sync mypy
      - name: Unit tests
        run: uv run --no-sync pytest
      - name: Structural course validation
        run: uv run --no-sync python scripts/course.py validate
      - name: Notebook validation
        run: uv run --no-sync python scripts/validate_notebooks.py
      - name: Register the course notebook kernel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: >-
          uv run --no-sync python -m ipykernel install --user
          --name ds60sqlpy --display-name "Python (ds60sqlpy)"
      - name: Offline notebook smoke execution
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run --no-sync python scripts/validate_notebooks.py --smoke

  learner-bootstrap:
    name: Learner bootstrap (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run the Windows learner setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\setup.ps1
      - name: Run the macOS/Linux learner setup
        if: runner.os != 'Windows'
        run: bash scripts/setup.sh
      - name: Re-run doctor with the Windows repository interpreter
        if: runner.os == 'Windows'
        run: .\.venv\Scripts\python.exe scripts\course.py doctor
      - name: Re-run doctor with the POSIX repository interpreter
        if: runner.os != 'Windows'
        run: .venv/bin/python scripts/course.py doctor
      - name: Ensure setup generated no trackable files
        run: >-
          python -c "import subprocess;
          result = subprocess.run(
          ['git', 'status', '--porcelain', '--untracked-files=all'],
          check=True, capture_output=True, text=True);
          print(result.stdout, end='');
          raise SystemExit(bool(result.stdout.strip()))"

  postgres:
    name: PostgreSQL 17 end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: advanced_sql_training
          POSTGRES_USER: ds60
          POSTGRES_PASSWORD: ds60
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ds60 -d advanced_sql_training"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DS60_DATABASE_URL: postgresql://ds60:ds60@localhost:5432/advanced_sql_training
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run all SQL lessons
        run: python scripts/course.py sql --quiet all --reset
      - name: Run all executable SQL solutions
        run: python scripts/course.py sql --quiet solutions --reset
      - name: Install the PostgreSQL notebook profile
        run: python -m pip install -e ".[notebooks,sql-notebooks]"
      - name: Register the course notebook kernel
        run: >-
          python -m ipykernel install --user
          --name ds60sqlpy --display-name "Python (ds60sqlpy)"
      - name: Execute the PostgreSQL magic solution notebook
        run: >-
          python -m nbconvert --execute --to notebook
          --output-dir /tmp
          bridge/professional/solutions/bridge_jupyter_01_postgresql_magics_solution.ipynb

  advanced-imports:
    name: Advanced imports (${{ matrix.os }}, Python 3.12)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Verify locked dependencies
        run: uv lock --check
      - name: Install every optional lesson dependency
        run: uv sync --frozen --all-extras
      - name: Import advanced dependencies in isolated processes
        run: uv run --no-sync python scripts/check_advanced_imports.py
