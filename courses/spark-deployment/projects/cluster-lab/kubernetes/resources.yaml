apiVersion: v1
kind: ResourceQuota
metadata:
  name: spark-workshop-budget
  namespace: NAMESPACE
spec:
  hard:
    pods: "8"
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "6"
    limits.memory: 10Gi
    requests.ephemeral-storage: 6Gi
    limits.ephemeral-storage: 12Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: spark-container-defaults
  namespace: NAMESPACE
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 250m
        memory: 512Mi
        ephemeral-storage: 512Mi
      default:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 2Gi
