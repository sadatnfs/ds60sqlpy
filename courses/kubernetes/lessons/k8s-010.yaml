apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello
          image: ds60sqlpy-k8s-fixture:0.2.0
          imagePullPolicy: Never
          command:
            - python
            - /fixture.py
            - server
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
# Exercise 1: Read requests versus limits. Identify the source request/limit fields and explain their roles. Expected: 10m/16Mi requests and100m/64Mi limits in the baseline;requests influence placement,limits constrain runtime.
# Exercise 2: Calculate the replica budget. Sum requests for two replicas and convert64Mi to bytes. Expected: 20m CPU,32Mi memory and67,108,864 bytes for64Mi.
# Exercise 3: Reject invalid source budgets. Compare request200m with limit100m in a scratch source. Expected: Broker refuses requests greater than limits before creating resources.
# Exercise 4: Diagnose quota versus scheduling. Match Forbidden/exceeded quota and Pending/FailedScheduling to their stages. Expected: Admission budget versus scheduler placement,with separate minimal investigations.
# Exercise 5: Interpret memory failure. Review a scoped synthetic OOMKilled record and a generic exit137 record. Expected: OOMKilled is specific memory-enforcement evidence;exit137 alone is insufficient to prove that cause.
# Exercise 6: Plan a bounded repair. Write a repair for one of the three failure records and its acceptance condition. Expected: One justified source/resource change,phase-specific success evidence and owned cleanup.
