name: Publish classroom images

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# One release at a time, including different versions and workflow attempts.
concurrency:
  group: classroom-dockerhub-publication
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-docker]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.intent.outputs.version }}
      mode: ${{ steps.intent.outputs.mode }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Validate release intent, version and registry permissions
        id: intent
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python scripts/docker_release.py gate --output work/release/gate.json --github-output "$GITHUB_OUTPUT"
      - name: Wait for exact-revision source and Docker starter success
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_release_status.py --report work/source-qualification.json
      - name: Derive the complete native worker matrix
        id: matrix
        run: echo "matrix=$(python scripts/ci_profiles.py --native --workers-only)" >> "$GITHUB_OUTPUT"
      - name: Retain this release gate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-gate-attempt-${{ github.run_attempt }}
          path: work/release/gate.json
          if-no-files-found: error
          retention-days: 7

  seed:
    name: Qualify application and Core (${{ matrix.architecture }})
    needs: gate
    if: needs.gate.outputs.mode == 'build'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      ARCHITECTURE: ${{ matrix.architecture }}
      CI_PROJECT: ds60-pub-seed-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Download the latest valid gate from this workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_release_artifacts.py gate --destination work/release
      - name: Build the native application and Core once
        run: >-
          python scripts/ci_classroom.py prepare --group python-core --project "$CI_PROJECT"
          --version "$RELEASE_VERSION" --architecture "$ARCHITECTURE" --confirm-disposable
      - name: Record the immutable images before qualification
        run: >-
          python scripts/docker_release.py inspect --gate work/release/gate.json
          --profiles "app python-core" --architecture "$ARCHITECTURE" --output work/tested-images.json
      - name: Qualify all Core references, SQL, failures, browser behavior and persistence
        run: >-
          python scripts/ci_classroom.py qualify --group python-core --project "$CI_PROJECT"
          --version "$RELEASE_VERSION" --architecture "$ARCHITECTURE" --confirm-disposable
      - name: Stage only the qualified application and Core image IDs
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/ds60-seed-stage"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s\n' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          python scripts/docker_release.py stage --gate work/release/gate.json \
            --tested-images work/tested-images.json --qualification work/module-reference-results.json \
            --qualification work/ci-qualification.json --output work/release-receipt.json
      - name: Retain immutable native seed digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-receipt-seed-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: work/release-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain small qualification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: seed-checks-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: |
            work/*receipts.json
            work/runtime-failures.json
            work/module-reference-results.json
            work/scientist-browser.json
            work/ci-qualification.json
            work/tested-images.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Capture owned service diagnostics
        if: failure()
        run: >-
          python scripts/ci_classroom.py diagnostics --group python-core --project "$CI_PROJECT"
          --version "$RELEASE_VERSION" --architecture "$ARCHITECTURE" --confirm-disposable
      - name: Remove only this disposable seed project
        if: always()
        run: >-
          python scripts/ci_classroom.py cleanup --group python-core --project "$CI_PROJECT"
          --version "$RELEASE_VERSION" --architecture "$ARCHITECTURE" --confirm-disposable

  workers:
    name: Qualify ${{ matrix.group }} (${{ matrix.architecture }})
    needs: [gate, seed]
    if: needs.gate.outputs.mode == 'build' && needs.seed.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    env:
      RELEASE_VERSION: ${{ needs.gate.outputs.version }}
      ARCHITECTURE: ${{ matrix.architecture }}
      CI_GROUP: ${{ matrix.group }}
      PROFILES: ${{ matrix.profiles }}
      CI_PROJECT: ds60-pub-${{ matrix.project_group }}-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Download this run's latest gate and qualified native seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/ci_release_artifacts.py gate --destination work/release
          python scripts/ci_release_artifacts.py seed --architecture "$ARCHITECTURE" --destination work/seed
      - name: Import qualified seed images by digest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/ds60-seed-import"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s\n' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          python scripts/docker_release.py import-seed --gate work/release/gate.json \
            --receipt work/seed/release-receipt.json --architecture "$ARCHITECTURE"
      - name: Build only the missing selected workers through the learner entrypoint
        run: >-
          python scripts/ci_classroom.py prepare --group "$CI_GROUP" --project "$CI_PROJECT"
          --version "$RELEASE_VERSION" --architecture "$ARCHITECTURE" --confirm-disposable
      - name: Record selected immutable image IDs before qualification
        run: >-
          python scripts/docker_release.py inspect --gate work/release/gate.json
          --profiles "$PROFILES" --architecture "$ARCHITECTURE"
          --seed-receipt work/seed/release-receipt.json --output work/tested-images.json
      - name: Qualify every selected reference, failure and lifecycle contract
        run: >-
          python scripts/ci_classroom.py qualify --group "$CI_GROUP" --project "$CI_PROJECT"
          --version "$RELEASE_VERSION" --architecture "$ARCHITECTURE" --confirm-disposable
      - name: Stage only the qualified selected worker IDs
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/ds60-worker-stage"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s\n' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          python scripts/docker_release.py stage --gate work/release/gate.json \
            --tested-images work/tested-images.json --qualification work/module-reference-results.json \
            --qualification work/ci-qualification.json --output work/release-receipt.json
      - name: Retain selected native candidate digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-receipt-${{ matrix.group }}-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: work/release-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain small qualification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: worker-checks-${{ matrix.group }}-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: |
            work/*receipts.json
            work/runtime-failures.json
            work/module-reference-results.json
            work/scientist-browser.json
            work/ci-qualification.json
            work/tested-images.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Capture owned service diagnostics
        if: failure()
        run: >-
          python scripts/ci_classroom.py diagnostics --group "$CI_GROUP" --project "$CI_PROJECT"
          --version "$RELEASE_VERSION" --architecture "$ARCHITECTURE" --confirm-disposable
      - name: Remove only this disposable worker project
        if: always()
        run: >-
          python scripts/ci_classroom.py cleanup --group "$CI_GROUP" --project "$CI_PROJECT"
          --version "$RELEASE_VERSION" --architecture "$ARCHITECTURE" --confirm-disposable

  promote:
    name: Promote the complete tested two-platform release
    needs: [gate, seed, workers]
    if: >-
      always() && needs.gate.result == 'success' &&
      (needs.gate.outputs.mode == 'promote-existing' ||
      (needs.gate.outputs.mode == 'build' && needs.seed.result == 'success' && needs.workers.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Download the latest qualified receipt per group from this run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ needs.gate.outputs.mode }}
        run: |
          python scripts/ci_release_artifacts.py gate --destination work/release
          mkdir -p work/receipts
          if [ "$RELEASE_MODE" = build ]; then
            python scripts/ci_release_artifacts.py receipts --destination work/receipts
          fi
      - name: Recheck exact-revision qualification before canonical writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_release_status.py --timeout-minutes 15 --report work/source-qualification-final.json
      - name: Promote immutable version indexes and then latest aliases
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: >-
          python scripts/docker_release.py promote --gate work/release/gate.json
          --receipts-dir work/receipts --output work/release/release.json
      - name: Retain the published digest inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: published-release-attempt-${{ github.run_attempt }}
          path: work/release/release.json
          if-no-files-found: error
          retention-days: 30

  hub-acceptance:
    name: Pull published classroom (${{ matrix.architecture }})
    needs: promote
    if: needs.promote.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Select this run's completed full promotion receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/ci_hub_acceptance.py fetch --mode full
          --destination work/hub-release/release.json
      - name: Inspect all published indexes and run a native Core starter
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/ds60-hub-acceptance"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s\n' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          python scripts/ci_hub_acceptance.py accept --mode full \
            --receipt work/hub-release/release.json --architecture "$ARCHITECTURE" \
            --report work/hub-acceptance.json
      - name: Retain distinct post-publication pull evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hub-acceptance-${{ matrix.architecture }}-attempt-${{ github.run_attempt }}
          path: |
            work/hub-acceptance.json
            work/hub-acceptance-diagnostics.json
          if-no-files-found: ignore
          retention-days: 30
