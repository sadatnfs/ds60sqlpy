apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hello
          image: ds60sqlpy-k8s-fixture:0.2.0
          imagePullPolicy: Never
          command:
            - python
            - /fixture.py
            - server
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
# Exercise 1: Identify image and process contract. Read the source image,pull policy,command and named port. Expected: Image0.2.0,Never,fixed fixture server,port8080 named http.
# Exercise 2: Trace broad and precise state. Classify the synthetic Running/Ready=False record. Expected: Process running,readiness unproved,no ready-routing claim.
# Exercise 3: Diagnose the image boundary. Compare unapproved-image broker rejection with ErrImageNeverPull from a scoped host fixture. Expected: Two different failure phases are named; neither is described as an application crash.
# Exercise 4: Read logs with identity. Record a bounded synthetic log excerpt with Pod UID,container name and restart count. Expected: An evidence record ties the line to the exact observed process instance.
# Exercise 5: Distinguish restart from replacement. Compare same Pod UID with restartCount1 against a new Pod UID with restartCount0. Expected: First is a container restart; second is a different Pod instance.
# Exercise 6: Prove the bounded baseline. Run the allowed source under a qualified lease and state what its result does and does not observe. Expected: Controller/Ready Pod identities and owned cleanup are observed; Deployment-only run has no Service-client proof.
