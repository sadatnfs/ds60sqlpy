# Optional companion: -f compose.yaml -f compose.modules.yaml -f compose.kubernetes.yaml
# Host preparation owns the kind cluster and private runtime files.
services:
  kubernetes-worker:
    image: ds60sqlpy-worker-k8s-kind:0.3.0
    pull_policy: never
    profiles: [k8s-kind]
    build:
      context: .
      dockerfile: docker/kubernetes/Dockerfile.worker
      args:
        DS60_PYTHON_IMAGE: ${DS60_PYTHON_IMAGE:-python:3.12.12-slim-bookworm}
    init: true
    stop_grace_period: 30s
    read_only: true
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, KILL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    cpus: 1
    mem_limit: 512m
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [module-private, kind-owned]
    environment:
      DS60_WORKER_TOKEN_FILE: /run/ds60/worker-token
      DS60_K8S_LEASE_FILE: /run/ds60/k8s-lease.json
    volumes:
      - type: bind
        source: ${DS60_MODULE_RUNTIME_DIR:?Prepare the private module session first}/worker-token
        target: /run/ds60/worker-token
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${DS60_K8S_SESSION_DIR:?Prepare an owned kind session first}/lease.json
        target: /run/ds60/k8s-lease.json
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${DS60_K8S_SESSION_DIR:?Prepare an owned kind session first}/worker.kubeconfig.json
        target: /run/ds60/worker.kubeconfig.json
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,os,urllib.request; t=open(os.environ['DS60_WORKER_TOKEN_FILE']).read().strip(); r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8081/health',headers={'X-DS60-Worker-Token':t}),timeout=3); assert json.load(r)['ready']",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
networks:
  kind-owned:
    external: true
    name: kind
