# Exercise 2: Establish controller ownership. Observe desired/updated/ready state and the Deployment-to-ReplicaSet-to-Pod UID chain. Expected: Exactly two owned Ready Pod identities for the intended generation.
# Exercise 3: Verify routing and values. Compare ready endpoint UIDs and fresh client responses with the fixed contract. Expected: UID sets match;version and both message values are exact.
# Exercise 4: Inject one bounded fault. Predict and run one admitted selector/probe/task negative case. Expected: The named check fails within budget and cleanup still targets only owned UIDs.
# Exercise 5: Repair and compare a fresh run. Restore the relevant field and execute a new bounded operation. Expected: The intended checks pass with new actual resource identities.
# Exercise 6: Hand off acceptance and limits. Prepare the finite service packet for a second learner. Expected: Source,nonsecret target identity,controller/backend/client/failure/cleanup evidence and unqualified surfaces are explicit.
