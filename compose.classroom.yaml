# Docker-only ordinary classroom. Kubernetes remains explicit owned host preparation.
# Build sequentially: docker compose -f compose.classroom.yaml --profile cpp20 --parallel 1 build
name: ds60-classroom

x-classroom-worker: &classroom-worker
  depends_on:
    classroom-init:
      condition: service_completed_successfully
  volumes:
    - type: volume
      source: classroom-runtime
      target: /run/ds60/worker-token
      read_only: true
      volume: { nocopy: true }
  environment:
    DS60_WORKER_TOKEN_FILE: /run/ds60/worker-token/token

services:
  postgres:
    extends: { file: compose.yaml, service: postgres }
    image: ${DS60_POSTGRES_IMAGE:-postgres:17}
    networks: [default, module-private]
    # Host ports can be engine-selected while the app keeps its fixed inner port.
    ports: !override
      - "127.0.0.1:${DS60_POSTGRES_PORT:-55432}:5432"
      - "127.0.0.1:${DS60_CLASSROOM_PORT:-${DS60_LAB_PORT:-8765}}:${DS60_LAB_PORT:-8765}"

  classroom-init:
    image: ${DS60_LAB_IMAGE:-ds60sqlpy-lab:1.3.0}
    pull_policy: never
    build:
      context: .
      args:
        DS60_BASE_IMAGE: ${DS60_BASE_IMAGE:-python:3.12-slim-bookworm}
        DS60_TEX_NODE_IMAGE: ${DS60_TEX_NODE_IMAGE:-node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205}
        DS60_DOCKER_PROFILES: ${DS60_DOCKER_PROFILES:-core}
    entrypoint: ["python", "/opt/course/docker/init_module_runtime.py"]
    command: []
    network_mode: none
    read_only: true
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    environment:
      DS60_UID: "1000"
      DS60_GID: "1000"
    volumes:
      - type: volume
        source: classroom-runtime
        target: /runtime
        volume: { nocopy: true }
      - type: volume
        source: classroom-learning
        target: /learning
        volume: { nocopy: true }

  lab:
    extends: { file: compose.yaml, service: lab }
    profiles: !reset []
    environment:
      DS60_UID: "1000"
      DS60_GID: "1000"
      DS60_ROOTLESS: "0"
      DS60_PUBLIC_PORT: ${DS60_PUBLIC_PORT:-${DS60_CLASSROOM_PORT:-${DS60_LAB_PORT:-8765}}}
      DS60_MODULE_TOKEN_FILE: /run/ds60/worker-token/token
      DS60_MODULE_ENDPOINTS: >-
        {"python-core":"http://python-core-worker:8081","python-web":"http://python-web-worker:8081","cpp20":"http://cpp-worker:8081",
        "tensorflow-cpu":"http://tensorflow-worker:8081","scala-jvm":"http://scala-worker:8081",
        "spark-local-scala":"http://spark-scala-worker:8081","spark-local-python":"http://spark-python-worker:8081",
        "llm-torch-cpu":"http://llm-worker:8081","java21":"http://java-worker:8081",
        "javascript-node":"http://javascript-worker:8081","typescript-node":"http://typescript-worker:8081",
        "c17":"http://c-worker:8081","go":"http://go-worker:8081","csharp-dotnet":"http://csharp-worker:8081",
        "rust-stable":"http://rust-worker:8081","swift-linux":"http://swift-worker:8081",
        "php-cli":"http://php-worker:8081","cuda-cpp":"http://cuda-cpp-worker:8081",
        "cuda-python":"http://cuda-python-worker:8081","pytorch-cuda":"http://pytorch-cuda-worker:8081",
        "tensorflow-cuda":"http://tensorflow-cuda-worker:8081",
        "jax-cpu":"http://jax-worker:8081","bayesian-cpu":"http://bayesian-worker:8081",
        "r-statistics":"http://r-worker:8081","data-engineering":"http://data-engineering-worker:8081",
        "data-platforms-python":"http://data-platforms-worker:8081",
        "stan-cpu":"http://stan-worker:8081","julia":"http://julia-worker:8081","dbt-duckdb":"http://dbt-worker:8081"}
    volumes:
      - type: volume
        source: classroom-learning
        target: /workspace/.learning
        volume: { nocopy: true }
      - type: volume
        source: classroom-runtime
        target: /run/ds60/worker-token
        read_only: true
        volume: { nocopy: true }
    depends_on:
      classroom-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  python-web-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: python-web-worker }

  python-core-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: python-core-worker }
    build:
      args:
        DS60_CORE_IMAGE: classroom-base
      additional_contexts:
        classroom-base: service:lab

  cpp-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: cpp-worker }

  tensorflow-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: tensorflow-worker }

  scala-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: scala-worker }

  spark-scala-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: spark-scala-worker }

  spark-python-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: spark-python-worker }

  llm-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: llm-worker }

  java-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: java-worker }

  javascript-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: javascript-worker }

  typescript-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: typescript-worker }

  c-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: c-worker }

  go-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: go-worker }

  csharp-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: csharp-worker }

  rust-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: rust-worker }

  swift-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: swift-worker }

  php-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: php-worker }

  cuda-cpp-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: cuda-cpp-worker }

  cuda-python-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: cuda-python-worker }

  pytorch-cuda-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: pytorch-cuda-worker }

  tensorflow-cuda-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: tensorflow-cuda-worker }

  dbt-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: dbt-worker }

  data-platforms-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: data-platforms-worker }

  data-engineering-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: data-engineering-worker }

  stan-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: stan-worker }

  julia-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: julia-worker }

  jax-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: jax-worker }

  bayesian-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: bayesian-worker }

  r-worker:
    <<: *classroom-worker
    extends: { file: compose.modules.yaml, service: r-worker }

volumes:
  postgres-data: {}
  classroom-learning: {}
  classroom-runtime: {}

networks:
  default: {}
  module-private:
    internal: true
