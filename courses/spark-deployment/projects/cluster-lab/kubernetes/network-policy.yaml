# Example policy for a dedicated namespace, not a universal CNI/cloud policy.
# Replace DNS namespace/labels and add API/storage egress for your actual cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spark-namespace-boundary
  namespace: NAMESPACE
spec:
  podSelector:
    matchLabels:
      ds60-workshop: spark-deployment
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              ds60-workshop: spark-deployment
  egress:
    - to:
        - podSelector:
            matchLabels:
              ds60-workshop: spark-deployment
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
