apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-config
data:
  message: reviewer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hello
        image: ds60sqlpy-k8s-fixture:0.2.0
        imagePullPolicy: Never
        command:
        - python
        - /fixture.py
        - server
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 2
          failureThreshold: 2
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: DS60_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: hello-config
              key: message
        volumeMounts:
        - name: lesson-config
          mountPath: /config
          readOnly: true
      volumes:
      - name: lesson-config
        configMap:
          name: hello-config
          items:
          - key: message
            path: message
---
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  selector:
    app: hello
  ports:
  - name: http
    port: 8080
    targetPort: http

