apiVersion: batch/v1
kind: Job
metadata:
  name: hello-task
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 20
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: task
          image: ds60sqlpy-k8s-fixture:0.2.0
          imagePullPolicy: Never
          command:
            - python
            - /fixture.py
            - task
            - --outcome
            - success
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Never
# Exercise 1: Identify finite-work controls. Read completions,parallelism,restartPolicy,backoffLimit and activeDeadlineSeconds. Expected: 1,1,Never,0 and20seconds for the reference.
# Exercise 2: Verify exact task output. Run the successful fixed task under a qualified lease. Expected: Owned Complete Job,controlled successful task Pod,exit0 and exact accepted3/rejected2/total35 output.
# Exercise 3: Observe intentional failure. Change only the allowed outcome from success to failure. Expected: Job reaches Failed;operation reports failure and cleans its owned UID.
# Exercise 4: Explain retry semantics. Compare backoffLimit0 and1 with restartPolicy Never. Expected: At most the declared retry budget is requested;Never does not forbid a replacement Pod attempt.
# Exercise 5: Review the suspended CronJob. Interpret schedule,timeZone,suspend,concurrency and starting deadline fields. Expected: A five-minute UTC schedule is configured but suspended;existing active Jobs require separate handling.
# Exercise 6: Design an idempotent handoff. Describe how a real finite task would avoid publishing duplicate effects after retry. Expected: A stable logical-work key,commit boundary,replay policy and acceptance ledger are named.
