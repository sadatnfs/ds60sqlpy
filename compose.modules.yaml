# Shared worker definitions extended by compose.classroom.yaml.
# Use ./classroom; the classroom supplies private named-volume credentials.
x-worker: &worker
  pull_policy: never
  networks: [module-private]
  init: true
  read_only: true
  user: "0:0"
  cap_drop: [ALL]
  cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, KILL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  cpus: 2
  mem_limit: 2g
  tmpfs:
    - /tmp:size=128m,mode=1777,exec
  healthcheck:
    test:
      [
        "CMD",
        "python3",
        "-c",
        "import json,os,urllib.request; t=open(os.environ['DS60_WORKER_TOKEN_FILE']).read().strip(); r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8081/health',headers={'X-DS60-Worker-Token':t}),timeout=3); assert json.load(r)['ready']",
      ]
    interval: 5s
    timeout: 5s
    retries: 24
    start_period: 60s

services:
  jax-worker:
    <<: *worker
    image: ${DS60_WORKER_JAX_CPU_IMAGE:-ds60sqlpy-worker-jax-cpu:0.5.0}
    profiles: [jax-cpu]
    mem_limit: 3g
    build:
      context: .
      dockerfile: docker/workers/Dockerfile.jax
      args:
        DS60_PYTHON_IMAGE: ${DS60_PYTHON_IMAGE:-python:3.12.12-slim-bookworm}
    environment:
      DS60_WORKER_PROFILE: jax-cpu
  bayesian-worker:
