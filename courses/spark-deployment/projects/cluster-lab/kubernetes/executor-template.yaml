apiVersion: v1
kind: Pod
metadata:
  labels:
    ds60-workshop: spark-deployment
spec:
  serviceAccountName: spark-executor
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 185
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: spark-kubernetes-executor
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          ephemeral-storage: 1Gi
        limits:
          ephemeral-storage: 2Gi
# UID 185 is a teaching assumption. Match the selected image's actual nonroot UID.
