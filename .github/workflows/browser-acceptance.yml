name: Desktop browser acceptance

# Builds a disposable starter classroom from this commit and drives it in real
# headless Chromium at the desktop viewport: lessons, walkthroughs, run, save,
# history, keyboard flow, axe in both themes, error and recovery cases, and
# draft preservation across a classroom container restart. Manual dispatch, or
# a push to the ci/browser-acceptance branch for a candidate commit.
on:
  workflow_dispatch:
  push:
    branches: [ci/browser-acceptance]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: browser-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Classroom desktop browser gate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PROJECT: ds60-ci-browser-acceptance
      AXE_VERSION: "4.14.1"
      AXE_INTEGRITY: "sha512-FHfa+lmNjQZfJz1q8wKqIDwC6DExcHt/pkjNQb09a3NPjCKg2rhu5qb2S4r76ASyFNNtuFooJpZe37OgudVGtQ=="
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build, start and smoke-test the disposable starter classroom
        run: |
          set -euo pipefail
          mkdir -p work
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          DS60_CLASSROOM_PORT=0 DS60_POSTGRES_PORT=0 COMPOSE_BAKE=false bash classroom --project "$PROJECT" \
            --registry mirrors --local-build --tag "$version" --starter --no-browser --port 0 --database-port 0
          URL="$(cat ".classroom/$PROJECT/classroom.url")"
          python scripts/check_lab_http.py --url "$URL" --confirm-disposable --reset-sql
          cat ".classroom/$PROJECT/classroom.url"
      - name: Install the hash-locked browser environment and pinned axe-core
        run: |
          set -euo pipefail
          python -m venv work/browser-env
          work/browser-env/bin/python -m pip install --no-cache-dir --require-hashes \
            --only-binary=:all: -r requirements/ci-browser.lock
          work/browser-env/bin/python -m playwright install --with-deps chromium
          mkdir -p work/axe
          curl --fail --silent --show-error --location -o work/axe/axe.tgz \
            "https://registry.npmjs.org/axe-core/-/axe-core-${AXE_VERSION}.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary work/axe/axe.tgz | base64 -w0)"
          [ "$actual" = "$AXE_INTEGRITY" ] || { echo "axe-core integrity mismatch"; exit 1; }
          tar -xzf work/axe/axe.tgz -C work/axe package/axe.min.js
      - name: Lessons, walkthroughs, workspace, keyboard and axe
        run: |
          set -euo pipefail
          URL="$(cat ".classroom/$PROJECT/classroom.url")"
          work/browser-env/bin/python scripts/check_classroom_browser.py --url "$URL" \
            --confirm-disposable --axe-script work/axe/package/axe.min.js \
            --report work/browser-acceptance/browser-receipts.json
      - name: Error and recovery flows
        run: |
          set -euo pipefail
          URL="$(cat ".classroom/$PROJECT/classroom.url")"
          python scripts/check_classroom_failures.py --url "$URL" --confirm-disposable \
            --profiles python-core --check-timeout \
            --report work/browser-acceptance/runtime-failures.json
      - name: Draft preservation across a classroom restart
        run: |
          set -euo pipefail
          URL="$(cat ".classroom/$PROJECT/classroom.url")"
          MARKER=work/browser-acceptance/restart-marker.json
          work/browser-env/bin/python scripts/check_classroom_browser.py --url "$URL" \
            --confirm-disposable --restart-stage write --restart-marker "$MARKER" \
            --report work/browser-acceptance/restart-write.json
          lab="$(docker compose --env-file docker/registry-mirrors.env.txt -f compose.classroom.yaml \
            -p "$PROJECT" ps -q lab)"
          [ -n "$lab" ] || { echo "No classroom container"; exit 1; }
          docker restart "$lab"
          for _ in $(seq 1 60); do
            curl --noproxy '*' --fail --silent --max-time 5 "$URL" >/dev/null && break
            sleep 2
          done
          curl --noproxy '*' --fail --silent --show-error --max-time 10 "$URL" >/dev/null
          work/browser-env/bin/python scripts/check_classroom_browser.py --url "$URL" \
            --confirm-disposable --restart-stage verify --restart-marker "$MARKER" \
            --report work/browser-acceptance/restart-verify.json
      - name: Require complete receipts
        if: always()
        run: |
          python - <<'PYTHON'
          import hashlib, json, pathlib, sys
          root = pathlib.Path("work/browser-acceptance")
          expected = {
              "browser-receipts.json": "complete",
              "runtime-failures.json": "passed",
              "restart-write.json": "complete",
              "restart-verify.json": "complete",
          }
          failed = False
          for name, key in expected.items():
              path = root / name
              if not path.is_file():
                  print(name, "missing")
                  failed = True
                  continue
              data = path.read_bytes()
              try:
                  value = json.loads(data).get(key)
              except (ValueError, AttributeError):
                  value = None
              print(name, hashlib.sha256(data).hexdigest(), f"{key}={value}")
              failed = failed or value is not True
          sys.exit(1 if failed else 0)
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-acceptance-receipts
          path: work/browser-acceptance
          if-no-files-found: warn
      - name: Remove the disposable classroom and its volumes
        if: always()
        run: |
          docker compose --env-file docker/registry-mirrors.env.txt -f compose.classroom.yaml \
            -p "$PROJECT" --profile '*' down --volumes --remove-orphans || true
