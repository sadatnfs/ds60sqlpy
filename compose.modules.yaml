      dockerfile: docker/workers/Dockerfile.spark
      args:
        DS60_SPARK_IMAGE: ${DS60_SPARK_IMAGE:-spark:4.0.1-scala2.13-java17-python3-ubuntu}
        DS60_PYTHON_IMAGE: ${DS60_PYTHON_IMAGE:-python:3.12.12-slim-bookworm}
