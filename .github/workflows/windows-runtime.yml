name: Windows runtime diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  UV_PYTHON: "3.12"

concurrency:
  group: windows-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-runtime:
    name: Windows PowerShell startup, private ACLs and portal
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Install locked diagnostic and test dependencies
        id: environment
        run: uv sync --frozen --extra quality
      - name: Prepare report and temporary workspace parent
        id: reports
        run: python -c "from pathlib import Path; Path('work/test-results').mkdir(parents=True, exist_ok=True)"
      # Prove ACL acceptance before comparison commands can warm module caches.
      - name: Exercise the real native private ACL boundary
        if: (success() || failure()) && steps.environment.outcome == 'success' && steps.reports.outcome == 'success'
        timeout-minutes: 3
        run: >-
          uv run --no-sync python scripts/check_windows_private_acl.py
          --report work/test-results/windows-private-acl.json
      - name: Compare fixed Windows PowerShell startup conditions
        if: (success() || failure()) && steps.environment.outcome == 'success' && steps.reports.outcome == 'success'
        timeout-minutes: 5
        run: >-
          uv run --no-sync python scripts/check_windows_runtime_startup.py
          --report work/test-results/windows-runtime-startup.json
      - name: Run focused portal, doctor and ACL contracts
        if: (success() || failure()) && steps.environment.outcome == 'success' && steps.reports.outcome == 'success'
        timeout-minutes: 5
        # Run without parallel contention while investigating native startup.
        # Failed diagnostic steps remain failures while these checks still run.
        run: >-
          uv run --no-sync python -m pytest -n 0
          tests/test_portal.py
          tests/test_doctor.py
          tests/test_windows_private_acl_probe.py
          tests/test_windows_runtime_startup_probe.py
          tests/test_kubernetes_module.py::test_windows_acl_command_keeps_paths_as_data_and_refuses_failed_policy
          tests/test_kubernetes_module.py::test_windows_acl_command_failure_never_establishes_trust
          tests/test_kubernetes_module.py::test_windows_acl_runtime_preserves_startup_directories_but_not_hooks_or_secrets
          tests/test_kubernetes_module.py::test_windows_acl_runtime_refuses_missing_or_nonlocal_system_directory
          --basetemp=work/windows-runtime-test-tmp
          --junitxml=work/test-results/windows-runtime-tests.xml --durations=10
      - name: Retain only diagnostic summaries and focused test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-runtime-diagnostics-${{ github.run_id }}
          path: |
            work/test-results/windows-runtime-startup.json
            work/test-results/windows-private-acl.json
            work/test-results/windows-runtime-tests.xml
          if-no-files-found: error
          retention-days: 7
