<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The box model, sizing and overflow</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; line-height: 1.6; }
    body { margin: 0; padding: 1.5rem; color: #172033; background: #f8fafc; }
    main { max-width: 65rem; margin-inline: auto; }
    a { color: #0753a4; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid #a34000; outline-offset: 3px; }
    #reference-status { display: block; margin-block-start: 2rem; border-block-start: 1px solid #64748b; padding-block-start: 1rem; }
*, *::before, *::after { box-sizing: border-box; } .card { inline-size: min(100%, 22rem); padding: 1.25rem; border: 2px solid #0753a4; overflow-wrap: anywhere; background: white; }
  </style>
</head>
<body>
<main><h1>Predictable boxes</h1><article class="card"><h2>A resilient card</h2><p>identifier_without_any_spaces_012345678901234567890123456789</p></article></main>
<output id="reference-status" aria-live="polite">Reference checks pending.</output>
<script>
"use strict";
function check(condition, message) {
  if (!condition) throw new Error(message);
}

check(getComputedStyle(document.querySelector('.card')).boxSizing === 'border-box', 'Sizing contract missing');
document.querySelector("#reference-status").textContent = "web-011 reference checks passed. Complete the manual observations in the guide.";
console.log("web-011 reference checks passed");
</script>
</body>
</html>
