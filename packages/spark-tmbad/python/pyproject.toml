[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ds60-spark-tmbad"
version = "0.2.0"
description = "Python frontend for prepared Spark JVM and native TMBad models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "DS60 contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
spark = ["pyspark==4.0.1"]
test = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ds60_spark_tmbad*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
