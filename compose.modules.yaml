    <<: *worker
    image: ${DS60_WORKER_CUDA_CPP_IMAGE:-ds60sqlpy-worker-cuda-cpp:0.5.0}
    platform: linux/amd64
    profiles: [cuda-cpp]
    mem_limit: 4g
    tmpfs:
      - /tmp:size=256m,mode=1777,exec
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${DS60_GPU_DEVICE:-0}"]
              capabilities: [gpu]
