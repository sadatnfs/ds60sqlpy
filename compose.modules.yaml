  go-worker:
    <<: *worker
    image: ds60sqlpy-worker-go:0.3.0
    profiles: [go]
    build:
      context: .
      dockerfile: docker/workers/Dockerfile.go
      args:
        DS60_GO_IMAGE: ${DS60_GO_IMAGE:-golang:1.27.3-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5}
    environment:
      <<: *worker-env
      DS60_WORKER_PROFILE: go

  csharp-worker:
    <<: *worker
    image: ds60sqlpy-worker-csharp-dotnet:0.3.0
    profiles: [csharp-dotnet]
    build:
      context: .
      dockerfile: docker/workers/Dockerfile.csharp
      args:
        DS60_DOTNET_IMAGE: ${DS60_DOTNET_IMAGE:-mcr.microsoft.com/dotnet/sdk:10.0@sha256:747cbade5bfd918a175ac32f8f1d931edec2c7d0d5397a3de72eaef1ac1f66d2}
