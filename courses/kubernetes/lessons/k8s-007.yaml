apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hello
        image: ds60sqlpy-k8s-fixture:0.2.0
        imagePullPolicy: Never
        command:
        - python
        - /fixture.py
        - server
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 2
          failureThreshold: 2
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: hello
spec:
  selector:
    app: hello
  ports:
  - name: http
    port: 8080
    targetPort: http

# Exercise 1: Trace selector equality. Compare Deployment template app=hello with Service selector app=hello and app=wrong. Expected: Matching selector finds the intended set;wrong selector has no intended backends.
# Exercise 2: Resolve the port chain. Read Service port,targetPort and container port name/number. Expected: Client8080 -> targetPort http -> container8080.
# Exercise 3: Count unique backends. Deduplicate the four synthetic EndpointSlice entries. Expected: Exactly two unique Pod UIDs matching the owned Ready set.
# Exercise 4: Run a selector negative case. Change only the allowed Service selector to app=wrong in an owned Run,then restore it. Expected: No matching ready backends;bounded failure and cleanup;restored source can pass separately.
# Exercise 5: Verify an independent client. Inspect the fresh client Job and exact /version result after backend checks. Expected: Job/Pod ownership and exit0 accompany the expected ds60-fixture-v1 payload contract.
# Exercise 6: Design a second-Service transfer. Explain a scoped host experiment using another Service without touching unrelated objects. Expected: A separate capability,unique owned resource receipt,selector/port/backend/client checks and UID-aware cleanup are specified.
