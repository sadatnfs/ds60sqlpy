apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: study-gateway
  labels: {course-fixture: deep-networking}
spec:
  gatewayClassName: study-controller
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: {from: Same}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: network-study-route
  labels: {course-fixture: deep-networking}
spec:
  parentRefs: [{name: study-gateway, sectionName: http}]
  hostnames: [study.example.test]
  rules:
    - backendRefs: [{name: network-study, port: 80}]
