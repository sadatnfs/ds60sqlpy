[project]
name = "ds60-pretrained-recipe"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1+cpu", "transformers==4.57.1", "trl==0.24.0",
  "peft==0.17.1", "datasets==4.3.0", "accelerate==1.11.0",
  "safetensors==0.6.2", "huggingface-hub==0.35.3", "numpy==2.2.6",
]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
