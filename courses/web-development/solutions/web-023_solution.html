<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print styles, progressive enhancement and resilient delivery</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; line-height: 1.6; }
    body { margin: 0; padding: 1.5rem; color: #172033; background: #f8fafc; }
    main { max-width: 65rem; margin-inline: auto; }
    a { color: #0753a4; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid #a34000; outline-offset: 3px; }
    #reference-status { display: block; margin-block-start: 2rem; border-block-start: 1px solid #64748b; padding-block-start: 1rem; }
section { margin-block: 1rem; padding: 1rem; border: 1px solid #64748b; } @media print { nav, #reference-status { display: none; } body { background: white; color: black; padding: 0; } section { break-inside: avoid; } }
  </style>
</head>
<body>
<main><nav aria-label="Notes"><a href="#notes">Read notes</a></nav><article id="notes"><h1>Printable study notes</h1><section><h2>Principle</h2><p>Preserve useful content before adding presentation.</p></section><section><h2>Evidence</h2><p>Inspect both screen and print output.</p></section></article></main>
<output id="reference-status" aria-live="polite">Reference checks pending.</output>
<script>
"use strict";
function check(condition, message) {
  if (!condition) throw new Error(message);
}

check(document.querySelector('article h1'), 'Printable document title missing');
document.querySelector("#reference-status").textContent = "web-023 reference checks passed. Complete the manual observations in the guide.";
console.log("web-023 reference checks passed");
</script>
</body>
</html>
