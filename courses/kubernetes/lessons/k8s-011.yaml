# k8s-011 starter. The learner starter allows one retry and a 30-second deadline; Exercise 1 asks you to set the reference budget. Compare with the separate reference in courses/kubernetes/solutions/ only after your attempt.
apiVersion: batch/v1
kind: Job
metadata:
  name: hello-task
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 30
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: task
          image: ds60sqlpy-k8s-fixture:0.2.0
          imagePullPolicy: Never
          command:
            - python
            - /fixture.py
            - task
            - --outcome
            - success
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Never
# Exercise 1: Identify finite-work controls. The starter Job allows one retry and a 30-second deadline. Read completions, parallelism, restartPolicy, backoffLimit and activeDeadlineSeconds, then set no retry and a 20-second deadline.
