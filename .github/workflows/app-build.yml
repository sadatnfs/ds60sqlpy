name: Application builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: application-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-starter:
    name: Portable Docker classroom starter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.6"
          enable-cache: true
          prune-cache: true
      - name: Install locked rendering and packaging dependencies
        run: uv sync --frozen
      - name: Package the complete Docker classroom starter
        run: >-
          uv run --no-sync python scripts/build_starter.py
          --output dist/DS60LearningLab-Docker-Starter.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DS60LearningLab-Docker-Starter
          path: dist/DS60LearningLab-Docker-Starter.zip
          if-no-files-found: error
          retention-days: 14

  docker-matrix:
    name: Select ordinary Docker qualification
    if: >-
      !(github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[publish-docker]'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      version: ${{ steps.selection.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Derive every ordinary group and the source version
        id: selection
        run: |
          echo "matrix=$(python scripts/ci_profiles.py)" >> "$GITHUB_OUTPUT"
          python - <<'PYTHON'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('version=' + version + '\n')
          PYTHON

  docker:
    name: Docker classroom (${{ matrix.group }})
    needs: docker-matrix
    if: needs.docker-matrix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.docker-matrix.outputs.matrix) }}
    env:
      CI_GROUP: ${{ matrix.group }}
      CI_PROJECT: ds60-ci-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
      RELEASE_VERSION: ${{ needs.docker-matrix.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Build and start through the learner entrypoint with verified mirrors
        run: >-
          python scripts/ci_classroom.py prepare --group "$CI_GROUP" --project "$CI_PROJECT"
          --version "$RELEASE_VERSION" --architecture amd64 --confirm-disposable
      - name: Qualify complete references, failures, browser behavior and retained state
        run: >-
          python scripts/ci_classroom.py qualify --group "$CI_GROUP" --project "$CI_PROJECT"
          --version "$RELEASE_VERSION" --architecture amd64 --confirm-disposable
      - name: Capture owned service diagnostics
        if: failure()
        run: >-
          python scripts/ci_classroom.py diagnostics --group "$CI_GROUP" --project "$CI_PROJECT"
          --version "$RELEASE_VERSION" --architecture amd64 --confirm-disposable
      - name: Retain bounded runtime reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: classroom-runtime-${{ matrix.group }}
          path: |
            work/*receipts.json
            work/runtime-failures.json
            work/module-reference-results.json
            work/scientist-browser.json
            work/ci-qualification.json
            work/browser-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove only this disposable CI project
        if: always()
        run: >-
          python scripts/ci_classroom.py cleanup --group "$CI_GROUP" --project "$CI_PROJECT"
          --version "$RELEASE_VERSION" --architecture amd64 --confirm-disposable
