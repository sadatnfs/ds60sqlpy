# Shared PostgreSQL and app definitions extended by compose.classroom.yaml.
# Use ./classroom for startup, named learner volumes and resume.

services:
  postgres:
    # DS60 builds PostgreSQL from docker/postgres (Debian security updates and
    # gosu rebuilt from source). DS60_POSTGRES_IMAGE may name another image.
    image: ${DS60_POSTGRES_IMAGE:-ds60sqlpy-postgres:1.4.3}
    pull_policy: never
    build:
      context: docker/postgres
      args:
        DS60_GOSU_GO_IMAGE: ${DS60_GOSU_GO_IMAGE:-golang:1.26-trixie@sha256:cff05dd6b81c901f2e8249eb6f91c69a60451d0f12c26bfef08e476a85b32d4d}
        DS60_POSTGRES_BASE_IMAGE: ${DS60_POSTGRES_BASE_IMAGE:-postgres:17.12-trixie@sha256:223efeb196329b55b3b9a13db144956411dbc18e727e59f681c3e0aede6475cf}
    environment:
      POSTGRES_DB: advanced_sql_training
      POSTGRES_USER: ds60_admin
      POSTGRES_PASSWORD: ds60_admin
      # New volumes require passwords on TCP, including the loopback the app shares;
      # the administrator socket inside this container stays local-only.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
    ports:
      - "127.0.0.1:${DS60_POSTGRES_PORT:-55432}:5432"
      - "127.0.0.1:${DS60_LAB_PORT:-8765}:${DS60_LAB_PORT:-8765}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
      - ./docker/admin:/opt/course-admin:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ds60_admin -d advanced_sql_training"]
      interval: 2s
      timeout: 5s
      retries: 30

  lab:
    image: ${DS60_LAB_IMAGE:-ds60sqlpy-lab:1.4.3}
    pull_policy: never
    build:
      context: .
      args:
        DS60_BASE_IMAGE: ${DS60_BASE_IMAGE:-python:3.12.16-slim-trixie@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b}
        DS60_TEX_NODE_IMAGE: ${DS60_TEX_NODE_IMAGE:-node:24.22.3-trixie-slim@sha256:af02d57b57719b9657a45199a79264a9437940cd55b3c7b3fc99615654f124a0}
        DS60_DOCKER_PROFILES: ${DS60_DOCKER_PROFILES:-core}
        DS60_PYTHON_INDEX_URL: ${DS60_PYTHON_INDEX_URL:-}
    network_mode: "service:postgres"
    environment:
      DS60_COURSE_USER: ${DS60_COURSE_USER:-admin}
      DS60_COURSE_PASSWORD: ${DS60_COURSE_PASSWORD:-admin}
      DS60_LAB_PORT: ${DS60_LAB_PORT:-8765}
      DS60_LAB_DATABASE_URL: ${DS60_LAB_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    mem_limit: ${DS60_LAB_MEMORY:-2g}
    pids_limit: 128
    cap_drop: [ALL]
    # KILL lets Docker's root init forward the stop signal after gosu drops
    # to the learner identity; without it the lab is killed, not stopped.
    cap_add: [CHOWN, SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "/opt/course/docker/healthcheck.py"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

volumes:
  postgres-data:
