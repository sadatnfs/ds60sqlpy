<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS rules, selectors and the cascade</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; line-height: 1.6; }
    body { margin: 0; padding: 1.5rem; color: #172033; background: #f8fafc; }
    main { max-width: 65rem; margin-inline: auto; }
    a { color: #0753a4; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid #a34000; outline-offset: 3px; }
    #reference-status { display: block; margin-block-start: 2rem; border-block-start: 1px solid #64748b; padding-block-start: 1rem; }
.note { background: #e0f2fe; padding: 1rem; color: #17324d; border-inline-start: .3rem solid #0753a4; }
  </style>
</head>
<body>
<main><h1>CSS notes</h1><p class="note">One shared component.</p><p class="note">A second shared component.</p></main>
<output id="reference-status" aria-live="polite">Reference checks pending.</output>
<script>
"use strict";
function check(condition, message) {
  if (!condition) throw new Error(message);
}

check(getComputedStyle(document.querySelector('.note')).paddingTop === '16px', 'Expected one-rem padding at default root size');
document.querySelector("#reference-status").textContent = "web-010 reference checks passed. Complete the manual observations in the guide.";
console.log("web-010 reference checks passed");
</script>
</body>
</html>
