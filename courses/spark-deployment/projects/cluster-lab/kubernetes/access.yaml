# Substitute NAMESPACE only in a copy. Apply only to an explicitly owned namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-driver
  namespace: NAMESPACE
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-executor
  namespace: NAMESPACE
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
  namespace: NAMESPACE
rules:
  # Cluster mode: the submitting kubeconfig identity creates the driver Pod, its
  # Service and its ConfigMap. Inside the cluster the driver only creates, watches
  # and removes executor Pods plus their configuration ConfigMap, so it holds no
  # Service, workload-controller, Secret or update/patch permission.
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
  namespace: NAMESPACE
subjects:
  - kind: ServiceAccount
    name: spark-driver
    namespace: NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-driver
