name: ds60-learning

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: advanced_sql_training
      POSTGRES_USER: ds60_admin
      POSTGRES_PASSWORD: ds60_admin
    ports:
      - "127.0.0.1:${DS60_POSTGRES_PORT:-55432}:5432"
      - "127.0.0.1:${DS60_LAB_PORT:-8765}:${DS60_LAB_PORT:-8765}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
      - ./docker/admin:/opt/course-admin:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ds60_admin -d advanced_sql_training"]
      interval: 2s
      timeout: 5s
      retries: 30

  sql-runner:
    image: postgres:17
    profiles: ["tools"]
    environment:
      PGPASSWORD: ${DS60_COURSE_PASSWORD:-admin}
    volumes:
      - .:/course:ro
    working_dir: /course
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - psql
      - -X
      - -v
      - ON_ERROR_STOP=1
      - --host
      - postgres
      - --username
      - ${DS60_COURSE_USER:-admin}
      - --dbname
      - advanced_sql_training

  lab:
    image: ${DS60_LAB_IMAGE:-ds60sqlpy-lab:0.4.0}
    pull_policy: never
    build:
      context: .
      args:
        DS60_BASE_IMAGE: ${DS60_BASE_IMAGE:-python:3.12-slim-bookworm}
        DS60_DOCKER_PROFILES: ${DS60_DOCKER_PROFILES:-core}
    profiles: ["lab"]
    network_mode: "service:postgres"
    environment:
      DS60_COURSE_USER: ${DS60_COURSE_USER:-admin}
      DS60_COURSE_PASSWORD: ${DS60_COURSE_PASSWORD:-admin}
      DS60_UID: ${DS60_UID:-1000}
      DS60_GID: ${DS60_GID:-1000}
      DS60_ROOTLESS: ${DS60_ROOTLESS:-0}
      DS60_LAB_PORT: ${DS60_LAB_PORT:-8765}
      DS60_LAB_DATABASE_URL: ${DS60_LAB_DATABASE_URL:-}
    volumes:
      - type: bind
        source: ${DS60_LEARNING_DIR:-./.learning}
        target: /workspace/.learning
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    mem_limit: ${DS60_LAB_MEMORY:-2g}
    pids_limit: 128
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "/opt/course/docker/healthcheck.py"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

volumes:
  postgres-data:
