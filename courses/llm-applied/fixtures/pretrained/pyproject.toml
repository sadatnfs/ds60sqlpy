[project]
name = "ds60-pretrained-recipe"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.15.0+cpu",
  "transformers==5.23.0",
  "trl==1.18.0",
  "peft==0.21.3",
  "datasets==5.2.0",
  "accelerate==1.16.0",
  "safetensors==0.8.0",
  "huggingface-hub==2.4.0",
  "numpy==2.2.6",
]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
