# Shared worker definitions extended by compose.classroom.yaml.
# Use ./classroom; the classroom supplies private named-volume credentials.
# Optional anonymous package mirrors for restricted networks. Set them only in an
# untracked .env file; locked versions and hashes are still enforced.
x-python-mirror: &python-mirror
  DS60_PYTHON_INDEX_URL: ${DS60_PYTHON_INDEX_URL:-}
x-npm-mirror: &npm-mirror
  DS60_NPM_REGISTRY: ${DS60_NPM_REGISTRY:-}

x-worker: &worker
  pull_policy: never
  # A worker that stops with an error (for example, killed out of memory) comes
  # back by itself; the classroom detects the new worker instance. A deliberate
  # stop, a Docker restart or a computer restart does not start workers.
  restart: on-failure
  networks: [module-private]
  init: true
  read_only: true
  user: "0:0"
  cap_drop: [ALL]
  cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, KILL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  cpus: 2
  mem_limit: 2g
  tmpfs:
    - /tmp:size=128m,mode=1777,exec
  healthcheck:
    test:
      [
        "CMD",
        "python3",
        "-c",
        "import json,os,urllib.request; t=open(os.environ['DS60_WORKER_TOKEN_FILE']).read().strip(); r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8081/health',headers={'X-DS60-Worker-Token':t}),timeout=3); assert json.load(r)['ready']",
      ]
    interval: 5s
    timeout: 5s
    retries: 24
    start_period: 60s

