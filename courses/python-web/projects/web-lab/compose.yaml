x-web: &web
  image: ${WORKSHOP_IMAGE:?Run ./workshop prepare}
  pull_policy: never
  init: true
  user: "${WORKSHOP_UID}:${WORKSHOP_GID}"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 96
  cpus: 1
  mem_limit: 384m
  tmpfs: ["/tmp:rw,nosuid,exec,size=64m"]
  volumes:
    - ./.workshop/password:/private/password:ro
    - ./.workshop/signing-key:/private/signing-key:ro
  labels:
    ds60.workshop: python-web-lab
  depends_on:
    postgres: { condition: service_healthy }
  healthcheck:
    test:
      [
        CMD,
        python,
        -c,
        "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).read()",
      ]
    interval: 5s
    timeout: 4s
    retries: 12
  stop_grace_period: 15s
x-environment: &environment
  WEB_DB_PASSWORD_FILE: /private/password
  WEB_SIGNING_KEY_FILE: /private/signing-key
  WEB_DB_HOST: postgres
services:
  postgres:
    image: ${WORKSHOP_POSTGRES_IMAGE:?Prepare the PostgreSQL image}
    pull_policy: never
    environment:
      POSTGRES_DB: web_lab
      POSTGRES_USER: web_lab
      POSTGRES_PASSWORD_FILE: /private/password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.workshop/password:/private/password:ro
    labels:
      ds60.workshop: python-web-lab
    cpus: 1
    mem_limit: 512m
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, web_lab, -d, web_lab]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *web
    profiles: [tools]
    command: [python, bootstrap.py]
    healthcheck: { disable: true }
    environment:
      <<: *environment
      WEB_ORIGIN: "http://127.0.0.1:${WORKSHOP_DJANGO_PORT}"
  flask:
    <<: *web
    command: [python, serve.py, flask]
    ports: ["127.0.0.1:${WORKSHOP_FLASK_PORT}:8080"]
    environment:
      <<: *environment
      WEB_ORIGIN: "http://127.0.0.1:${WORKSHOP_FLASK_PORT}"
  fastapi:
    <<: *web
    command: [python, serve.py, fastapi]
    ports: ["127.0.0.1:${WORKSHOP_FASTAPI_PORT}:8080"]
    environment:
      <<: *environment
      WEB_ORIGIN: "http://127.0.0.1:${WORKSHOP_FASTAPI_PORT}"
  django:
    <<: *web
    command: [python, serve.py, django]
    ports: ["127.0.0.1:${WORKSHOP_DJANGO_PORT}:8080"]
    environment:
      <<: *environment
      WEB_ORIGIN: "http://127.0.0.1:${WORKSHOP_DJANGO_PORT}"
  worker:
    <<: *web
    command: [python, serve.py, worker]
    healthcheck:
      test: [CMD, python, worker_health.py]
      interval: 3s
      timeout: 3s
      retries: 5
    environment:
      <<: *environment
      WEB_ORIGIN: "http://127.0.0.1:${WORKSHOP_FASTAPI_PORT}"
volumes:
  postgres-data:
    labels:
      ds60.workshop: python-web-lab
