# Substitute NAMESPACE only in a copy. Apply only to an explicitly owned namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-driver
  namespace: NAMESPACE
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-executor
  namespace: NAMESPACE
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
  namespace: NAMESPACE
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
  namespace: NAMESPACE
subjects:
  - kind: ServiceAccount
    name: spark-driver
    namespace: NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-driver
