repos:
  - repo: local
    hooks:
      - id: ds60-secret-scan
        name: DS60 sensitive-content scan
        entry: python scripts/scan_secrets.py
        language: system
        pass_filenames: false
      - id: ds60-lint-check
        name: DS60 static source checks (Docker)
        entry: ./scripts/lint-repo
        language: system
        pass_filenames: false
        always_run: true
      - id: ds60-format-check
        name: DS60 repository formatting check (Docker)
        entry: ./scripts/format-repo --check
        language: system
        pass_filenames: false
        always_run: true
