# Synthetic contract-2 fixture. Requires a newly qualified owned lease.
apiVersion: batch/v1
kind: Job
metadata:
  name: hello-task
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 20
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app: hello
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: task
          image: ds60sqlpy-k8s-fixture:0.2.0
          imagePullPolicy: Never
          command:
            - python
            - /fixture.py
            - task
            - --outcome
            - success
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Never
