name: JourneyApp
options:
  minimumXcodeGenVersion: 2.42.0
  bundleIdPrefix: org.example.journey
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
packages:
  JourneyCore:
    path: ../JourneyCore
targets:
  JourneyMac:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: JourneyCore
        product: JourneyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.journey.mac
        INFOPLIST_KEY_CFBundleDisplayName: Journey
  JourneyIOS:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: JourneyCore
        product: JourneyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.journey.ios
        INFOPLIST_KEY_CFBundleDisplayName: Journey
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  JourneyMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: JourneyMac
  JourneyIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: JourneyIOS
schemes:
  JourneyMac:
    build:
      targets:
        JourneyMac: all
    test:
      targets: [JourneyMacUITests]
  JourneyIOS:
    build:
      targets:
        JourneyIOS: all
    test:
      targets: [JourneyIOSUITests]
