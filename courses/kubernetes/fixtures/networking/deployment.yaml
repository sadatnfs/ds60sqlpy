apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-study
  labels: { course-fixture: deep-networking }
spec:
  replicas: 2
  selector:
    matchLabels: { app: network-study }
  template:
    metadata:
      labels: { app: network-study, course-fixture: deep-networking }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ds60sqlpy-k8s-fixture:0.2.0
          imagePullPolicy: Never
          command: [python, /fixture.py, server]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 2
            failureThreshold: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
